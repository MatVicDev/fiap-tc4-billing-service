apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-service-config
  namespace: oficina
data:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://billing-postgres:5432/billing_db"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  RABBITMQ_HOST: "rabbitmq.mensageria.svc.cluster.local"
  RABBITMQ_PORT: "5672"
  # "fake" = checkout simulado; "mercadopago" = API real (exige MERCADOPAGO_ACCESS_TOKEN no Secret)
  MERCADOPAGO_MODO: "fake"
  # URL pública do ALB; o pipeline do EKS preenche com o hostname real do Ingress.
  BILLING_URL_PUBLICA: "http://localhost:8081"
  MERCADOPAGO_NOTIFICATION_URL: ""
  DD_SERVICE: "billing-service"
  DD_ENV: "production"
  DD_VERSION: "1.0.0"
  DD_TRACE_SAMPLE_RATE: "1"
  DD_LOGS_INJECTION: "true"
