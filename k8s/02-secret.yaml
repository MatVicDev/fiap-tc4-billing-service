# Valores placeholder para uso local (kind/CI). No EKS o pipeline recria o Secret com
# os valores reais (incluindo as credenciais do Mercado Pago) antes do rollout.
apiVersion: v1
kind: Secret
metadata:
  name: billing-service-secret
  namespace: oficina
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: "billing_user"
  SPRING_DATASOURCE_PASSWORD: "billing_password"
  RABBITMQ_USERNAME: "oficina"
  RABBITMQ_PASSWORD: "oficina"
  JWT_SECRET: "troque-esta-chave-por-uma-secreta-de-pelo-menos-32-caracteres"
  MERCADOPAGO_ACCESS_TOKEN: ""
  MERCADOPAGO_WEBHOOK_SECRET: ""
